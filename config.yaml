pipeline:
  embed_dim: 768
  sentence_transformer_model: "all-mpnet-base-v2"
  spacy_model: "en_core_web_sm"

thresholds:
  exact_deduplicate: true
  near_duplicate_sim: 0.90
  relevance_sim: 0.25

credibility:
  "reuters.com": 0.95
  "bloomberg.com": 0.95
  "ft.com": 0.90
  "economictimes.indiatimes.com": 0.85
  "business-standard.com": 0.80
  "techcrunch.com": 0.60
  "unknownblog.com": 0.30

prompts:
  fmcg_intents:
    - "company acquires stake in a food or consumer brand"
    - "startup raises funding in FMCG or grocery sector"
    - "venture capital invests in a consumer goods startup"
    - "private equity firm buys stake in a packaged food company"
    - "merger between consumer brands or FMCG companies"
    - "D2C brand raises investment for food, beauty or household products"
    - "grocery or quick commerce startup receives funding"
    - "acquisition of a skincare, cosmetics or personal care brand"
    - "investment in beverage, dairy or packaged food company"
    - "consumer goods company expansion through acquisition or funding"
